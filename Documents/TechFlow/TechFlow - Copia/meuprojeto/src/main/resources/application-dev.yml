# Configuração para Desenvolvimento - SQLite
spring:
  datasource:
    url: jdbc:sqlite:./data/techflow-dev.db
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
  
  jpa:
    hibernate:
      ddl-auto: update  # Usar update ao invés de create-drop
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        show_sql: true
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    defer-datasource-initialization: true
  
  # Inicialização de dados
  sql:
    init:
      mode: embedded
      data-locations: classpath:data-dev.sql
      continue-on-error: true

# Configurações específicas para desenvolvimento
logging:
  level:
    com.techflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Desabilitar cache para desenvolvimento
server:
  error:
    include-stacktrace: always
    include-message: always
